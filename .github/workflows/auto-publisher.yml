name: Auto-Publicador Historias Pizzería

on:
  schedule:
    # Se ejecuta cada 15 minutos en los servidores de GitHub
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite probar o ejecutar manualmente desde GitHub con un botón

jobs:
  publish-stories:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Verificación y Publicación en Meta
        run: node scripts/cloud-scheduler.js
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_FACEBOOK_PAGE_ID: ${{ secrets.META_FACEBOOK_PAGE_ID }}
