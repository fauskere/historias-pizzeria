name: Auto-Publicador Historias Pizzería

on:
  schedule:
    # MIÉRCOLES A DOMINGO (Lunes y Martes 100% apagado)
    
    # 1) TARDE: 13:30 a 18:30 hs Argentina (cada 30 min) -> 16:30 a 21:30 UTC (Miércoles a Domingo: WED-SUN)
    - cron: '30 16 * * WED-SUN'
    - cron: '0,30 17-21 * * WED-SUN'

    # 2) HORA PICO: 19:00 a 20:30 hs Argentina (cada 15 min) -> 22:00 a 23:30 UTC (Miércoles a Domingo: WED-SUN)
    - cron: '0,15,30,45 22 * * WED-SUN'
    - cron: '0,15,30 23 * * WED-SUN'

    # 3) NOCHE: 20:30 a 22:00 hs Argentina (cada 30 min) -> 00:00 a 01:00 UTC (Jueves a Lunes en UTC: THU-MON)
    - cron: '0,30 0 * * THU-MON'
    - cron: '0 1 * * THU-MON'

    # Consumo: 21 ejecuciones por día activo x 5 días a la semana = ~105 ejecuciones semanales (~450 min/mes).
    # Lunes y Martes apagado las 24 hs.

  workflow_dispatch: # Permite probar o ejecutar manualmente desde GitHub con un botón si hiciera falta

jobs:
  publish-stories:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Verificación y Publicación en Meta
        run: node scripts/cloud-scheduler.js
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_FACEBOOK_PAGE_ID: ${{ secrets.META_FACEBOOK_PAGE_ID }}
