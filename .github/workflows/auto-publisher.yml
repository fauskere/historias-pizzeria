name: Auto-Publicador Historias Pizzería

on:
  schedule:
    # Se ejecuta en horario comercial de la pizzería (13:00 a 22:30 hs Argentina / 16:00 a 01:30 UTC)
    # Se usan minutos impares (2, 17, 32, 47) para evitar la congestión masiva de GitHub a las :00 y :30
    - cron: '2,17,32,47 16-23,0-1 * * *'

  workflow_dispatch: # Permite disparar manualmente desde GitHub o API en cualquier momento

jobs:
  publish-stories:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Verificación y Publicación en Meta
        run: node scripts/cloud-scheduler.js
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_FACEBOOK_PAGE_ID: ${{ secrets.META_FACEBOOK_PAGE_ID }}
